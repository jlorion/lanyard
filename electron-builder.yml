appId: dev.riomar.lanyard
productName: Lanyard
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - bin/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
extraResources:
  - from: resources/cli
    to: cli
# Release file names carry the version and architecture and contain no spaces.
win:
  target: nsis
  icon: resources/icon.ico
  executableName: Lanyard
nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Adds / removes the `lanyard` and `lny` commands on the user's PATH.
  include: build/installer.nsh
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Ad-hoc signature: without any signature Apple Silicon reports the app as damaged.
  identity: '-'
  icon: resources/icon.png
  category: public.app-category.developer-tools
linux:
  target: AppImage
  artifactName: ${productName}-${version}-${arch}.${ext}
  executableName: lanyard
  icon: resources/icon.png
  category: Development
# Electron fuses, flipped in the packaged binary. RunAsNode stays on because the
# installed `lanyard` command runs Lanyard.exe with ELECTRON_RUN_AS_NODE.
electronFuses:
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
