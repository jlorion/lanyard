appId: dev.riomar.lanyard
productName: Lanyard
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - bin/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
extraResources:
  - from: resources/cli
    to: cli
win:
  target: nsis
  icon: resources/icon.ico
  executableName: Lanyard
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Adds / removes the `lanyard` and `lny` commands on the user's PATH.
  include: build/installer.nsh
mac:
  target: dmg
  icon: resources/icon.png
  category: public.app-category.developer-tools
linux:
  target: AppImage
  executableName: lanyard
  icon: resources/icon.png
  category: Development
