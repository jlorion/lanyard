# Build the website (website/) and publish it to GitHub Pages.
#
# The site reads the user guide from docs/wiki and the changelog from
# CHANGELOG.md, and bakes in direct download links for the newest release.
# release.yml runs this after publishing a release so the links follow it.
#
# One-time setup: Settings -> Pages -> Source: GitHub Actions.

name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'CHANGELOG.md', 'package.json', '.github/workflows/pages.yml']
  pull_request:
    paths: ['website/**', 'docs/**', 'CHANGELOG.md', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Avoids GitHub API rate limits when looking up the newest release.
          GITHUB_TOKEN: ${{ github.token }}
          # On a custom domain (repository variable PAGES_DOMAIN, e.g.
          # lanyard.example.com) the site lives at the root instead of /lanyard/.
          SITE_BASE: ${{ vars.PAGES_DOMAIN && '/' || '/lanyard/' }}
          VITE_SITE_URL: ${{ vars.PAGES_DOMAIN && format('https://{0}', vars.PAGES_DOMAIN) || 'https://riomar0001.github.io' }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
