# Build the website (website/) and publish it to GitHub Pages.
#
# The site reads the user guide from docs/wiki and the changelog from
# CHANGELOG.md, and bakes in direct download links for the newest release.
# release.yml runs this after publishing a release so the links follow it.
#
# One-time setup: Settings -> Pages -> Source: GitHub Actions.

name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'CHANGELOG.md', 'package.json', '.github/workflows/pages.yml']
  pull_request:
    paths: ['website/**', 'docs/**', 'CHANGELOG.md', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read # configure-pages reads the site's address
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # Ask GitHub Pages where the site lives: the root of a custom domain
      # (https://lanyard.riomar.dev, base path "") or the project path
      # (https://riomar0001.github.io/lanyard). Pull requests can't read the
      # Pages settings, so their test build uses the project path.
      - name: Read the Pages address
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - run: npm run build
        env:
          # Avoids GitHub API rate limits when looking up the newest release.
          GITHUB_TOKEN: ${{ github.token }}
          SITE_BASE: ${{ steps.pages.outcome == 'success' && format('{0}/', steps.pages.outputs.base_path) || '/lanyard/' }}
          VITE_SITE_URL: ${{ steps.pages.outputs.origin || 'https://riomar0001.github.io' }}
      - name: Show the address it was built for
        run: echo "Built for ${{ steps.pages.outputs.base_url || 'https://riomar0001.github.io/lanyard' }}" >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
