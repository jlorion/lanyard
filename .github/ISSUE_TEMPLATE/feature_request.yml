name: Feature request
description: Suggest something Lanyard should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you imagine it working, in the app, the tray or the CLI.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you use now
